version: 1
title: Доменная модель ub-timer
visual_canon: 05_схема_БД.drawio
visual_preview: 05_схема_БД.svg
human_doc: 05_доменная_модель.md
sources:
  - docs/планы/05_схема_БД.drawio
  - docs/планы/05_схема_БД_и_портал.plan.md
  - README.md
  - History.log  # хвост про домен, 2026-08-12…13
notes:
  - id на UML есть не у всех классов; суррогаты MySQL — черновик маппинга, не доменные атрибуты.

computed:
  - name: ярлыкВовлечения
    stored: false
    labels: [новичок, опытный, орг, судья ФУБ]
    derived_from: "круги + статистика (рейтинг и история игр)"
    note: "Не колонка БД; не ЧленствоВКруге.степеньВовлечения"

classes:
  - name: Круг
    attributes:
      - name: id
        type: Integer
        required: true
      - name: название
        type: String
        required: true
        note: "«Я-ИТ_ы», «ФУБ», …"

  - name: ЧленствоВКруге
    attributes:
      - name: степеньВовлечения
        type: String
        required: true
        note: "Не закрытый enum. Примеры: ЧС_A1, ЧС_B2; Функционер ФУБ, Профессиональный судья, Профессиональный арбитр. Не ярлык новичок/опытный/орг/судья ФУБ"
    notes:
      - "Две записи допустимы (в т.ч. один человек в одном круге дважды); нет UNIQUE(человек, круг)"

  - name: Человек
    attributes:
      - name: id
        type: Integer
        required: true
      - name: ФИО
        type: String
        required: true
        note: "Канон «Фамилия Имя»; жёсткой уникальности нет (коллизию решать вручную)"
      - name: email
        type: String
        required: false
      - name: telegram
        type: String
        required: false
        note: "@username или id"
      - name: активен
        type: Boolean
        required: true
      - name: заметки
        type: Text
        required: false
    notes:
      - "Ярлыки новичок/опытный/орг/судья ФУБ — вычислимые (круги + статистика), не колонка"
      - "Жёсткой уникальности ФИО нет; полных однофамильцев пока нет — наблюдение, не UNIQUE(ФИО)"

  - name: Мероприятие
    attributes:
      - name: ярлык
        type: String
        required: false
        note: "Опциональный URL-slug портала, не название (kupala_26, online_27); без ярлыка ссылка по id; UNIQUE среди заданных (NULL/пустое не конфликтует)"
      - name: название
        type: String
        required: true
      - name: тип
        type: ТипМероприятия
        required: true
      - name: датаНачала
        type: Date
        required: false
      - name: датаОкончания
        type: Date
        required: false
      - name: времяНачала
        type: Time
        required: false
        note: "МСК; у онлайна с датой по умолчанию 11:00"
      - name: времяОкончания
        type: Time
        required: false
        note: "МСК; у онлайна с датой по умолчанию 13:30"
      - name: статус
        type: СтатусМероприятия
        required: true
      - name: ссылкаZoom
        type: String
        required: false
        note: "Полный Zoom у онлайна; на портале и в ICS только короткий редирект /z/{id}"

  - name: УчастиеВОрганизацииМероприятия
    attributes:
      - name: idУчастника
        type: Integer
        required: true
        note: "→ Человек"
      - name: роль
        type: РольОрганизатора
        required: true
        note: "Закрытый список. Несколько ролей у человека на мероприятии = несколько записей УчастиеВОрганизацииМероприятия. UNIQUE(мероприятие, человек, роль)"

  - name: Наблюдатель
    attributes:
      - name: idУчастника
        type: Integer
        required: true
        note: "→ Человек"

  - name: РегистрацияНаМероприятие
    attributes:
      - name: участникФИО
        type: String
        required: true
        note: "Если email пуст — UNIQUE в рамках мероприятия вместе с мероприятием"
      - name: email
        type: String
        required: false
        note: "Если задан — UNIQUE в рамках мероприятия вместе с мероприятием"
      - name: telegram
        type: String
        required: false
      - name: idУчастника
        type: Integer
        required: false
        note: "0..1 → Человек"
      - name: хочетИграть
        type: Boolean
        required: true
      - name: хочетСудить
        type: Boolean
        required: true
      - name: хочетБытьСекундантом
        type: Boolean
        required: true
      - name: комментарий
        type: Text
        required: false
      - name: источник
        type: String
        required: false
    notes:
      - "В рамках мероприятия уникальна: нельзя две заявки с тем же email; если email пуст — нельзя две с тем же ФИО"
      - "Не глобальный UNIQUE по ФИО на все мероприятия"
      - "Повторная регистрация: «Вы уже зарегистрированы»"

  - name: Ситуация
    attributes:
      - name: id
        type: Integer
        required: true
      - name: код
        type: String
        required: true
        note: "напр. 110; не UNIQUE (ситуация может повторяться в банке)"
      - name: номер
        type: Integer
        required: false
      - name: тип
        type: ТипПоединка
        required: true
        note: "Тот же enum, что у Поединок.тип"
      - name: описание
        type: Json
        required: false
      - name: роли
        type: Json
        required: false
      - name: опубликована
        type: Boolean
        required: true
    notes:
      - "Подпись не хранится: конкатенация код+номер"
      - "Нет UNIQUE(код); код+номер могут совпадать у разных записей"

  - name: Поединок
    attributes:
      - name: порядок
        type: Integer
        required: true
        note: "UNIQUE по сути (мероприятие, дата, порядок); не глобально (мероприятие, порядок)"
      - name: дата
        type: Date
        required: false
        note: "Для однодневных можно null"
      - name: тип
        type: ТипПоединка
        required: true
      - name: режимПодготовки
        type: РежимПодготовкиИгроков
        required: true
      - name: длительностьРаундаМин
        type: Integer
        required: true
        note: "∈ {5, 4, 1}; экспресс=1, парный=5, классика ∈ {4, 5}"
      - name: игрок1Id
        type: Integer
        required: false
        note: "→ Человек; линия на диаграмме не рисуется"
      - name: секундантИлиВторойИгрок1Id
        type: Integer
        required: false
        note: "классика: секундант 1; парный: 2-й игрок стороны 1; экспресс: строго NULL"
      - name: игрок2Id
        type: Integer
        required: false
      - name: секундантИлиВторойИгрок2Id
        type: Integer
        required: false
        note: "классика: секундант 2; парный: 2-й игрок стороны 2; экспресс: строго NULL"
      - name: количествоСудей
        type: Integer
        required: false
        note: "COUNT(Судья) у поединка; не вместимость формы (экспресс 5 слотов, классика/парный 5/7/9)"
      - name: заметки
        type: Text
        required: false

  - name: Судья
    attributes:
      - name: idУчастника
        type: Integer
        required: false
        note: "→ Человек. Обязателен у живого судьи; null если коллегия=неизвестна (голос без ФИО)"
      - name: коллегия
        type: КоллегияСудьи
        required: false
      - name: голос
        type: String
        required: false
        note: "за кого; не закрытый справочник"
    notes:
      - "Поля индекс нет; вместимость формы 5/7/9 — тип/UI; количествоСудей = COUNT(Судья)"
      - "Состав считает алгоритм, не роль орга; записи — результат алгоритма"

  - name: СобытиеПротокола
    attributes:
      - name: порядковыйНомер
        type: Integer
        required: true
        note: "Опциональный/удобный счётчик; не UNIQUE; порядок и идентичность — по момент / моментСек"
      - name: моментСек
        type: Integer
        required: false
      - name: типСобытия
        type: ТипСобытияПротокола
        required: true
      - name: данные
        type: Json
        required: false
    notes:
      - "Ход боя пишет таймер; не роль УчастиеВОрганизацииМероприятия и не велПротоколы"

  - name: ЖурналИзмененияПоединка
    attributes:
      - name: момент
        type: DateTime
        required: true
      - name: поле
        type: String
        required: true
      - name: староеЗначение
        type: Text
        required: false
      - name: новоеЗначение
        type: Text
        required: false
      - name: авторId
        type: Integer
        required: false
        note: "0..1 → Человек; линия на диаграмме не рисуется"

  - name: Видео
    attributes:
      - name: id
        type: Integer
        required: true
      - name: ссылка
        type: String
        required: true
      - name: дата
        type: Date
        required: false
      - name: название
        type: String
        required: false
      - name: тип
        type: ТипВидео
        required: false

associations:
  - from: Круг
    to: ЧленствоВКруге
    from_mult: "1"
    to_mult: "0..*"
    composition: false
    role: члены
  - from: Человек
    to: ЧленствоВКруге
    from_mult: "1"
    to_mult: "0..*"
    composition: false
    role: членства
  - from: Человек
    to: УчастиеВОрганизацииМероприятия
    from_mult: "1"
    to_mult: "0..*"
    composition: false
    role: как_участие_в_организации_мероприятия
  - from: Человек
    to: Наблюдатель
    from_mult: "1"
    to_mult: "0..*"
    composition: false
    role: как_наблюдатель
  - from: Человек
    to: РегистрацияНаМероприятие
    from_mult: "0..1"
    to_mult: "0..*"
    composition: false
    role: карточка_заявки
  - from: Человек
    to: Мероприятие
    from_mult: "0..1"
    to_mult: "0..*"
    composition: false
    role: арбитр
  - from: Человек
    to: Судья
    from_mult: "1"
    to_mult: "0..*"
    composition: false
    role: как_судья
  - from: Мероприятие
    to: УчастиеВОрганизацииМероприятия
    from_mult: "1"
    to_mult: "0..*"
    composition: true
    role: участия_в_организации_мероприятия
  - from: Мероприятие
    to: Наблюдатель
    from_mult: "1"
    to_mult: "0..*"
    composition: true
    role: наблюдатели
  - from: Мероприятие
    to: РегистрацияНаМероприятие
    from_mult: "1"
    to_mult: "0..*"
    composition: true
    role: регистрации
  - from: Мероприятие
    to: Поединок
    from_mult: "1"
    to_mult: "0..*"
    composition: true
    role: поединки
  - from: Мероприятие
    to: Видео
    from_mult: "1"
    to_mult: "0..*"
    composition: false
    role: видео
  - from: Ситуация
    to: Поединок
    from_mult: "0..1"
    to_mult: "0..*"
    composition: false
    role: ситуация
  - from: Поединок
    to: Видео
    from_mult: "0..1"
    to_mult: "0..*"
    composition: false
    role: клипы
  - from: Поединок
    to: Судья
    from_mult: "1"
    to_mult: "0..*"
    composition: true
    role: судьи
  - from: Поединок
    to: СобытиеПротокола
    from_mult: "1"
    to_mult: "0..*"
    composition: true
    role: протокол
  - from: Поединок
    to: ЖурналИзмененияПоединка
    from_mult: "1"
    to_mult: "0..*"
    composition: true
    role: журнал

attribute_refs:
  - from: Поединок
    attr: игрок1Id
    to: Человек
    required: false
    on_diagram: false
  - from: Поединок
    attr: секундантИлиВторойИгрок1Id
    to: Человек
    required: false
    on_diagram: false
  - from: Поединок
    attr: игрок2Id
    to: Человек
    required: false
    on_diagram: false
  - from: Поединок
    attr: секундантИлиВторойИгрок2Id
    to: Человек
    required: false
    on_diagram: false
  - from: ЖурналИзмененияПоединка
    attr: авторId
    to: Человек
    required: false
    on_diagram: false

enums:
  - name: ТипМероприятия
    values: [онлайн, купала, новогоднее, региональный, турнир]
    note: >
      региональный — офлайн в городе и мини-офлайн (Воронеж, Полярный экспресс).
      турнир — УБ Лидер.
  - name: СтатусМероприятия
    values: [Запланировано, Подготовка, Проведено, Отменено]
  - name: ТипПоединка
    values: [классика, экспресс, парный]
    note: "Общий справочник для Ситуация.тип и Поединок.тип. Бывший ТипСитуации удалён."
  - name: РежимПодготовкиИгроков
    values:
      - name: обычный
        text: ситуация и подпись известны заранее
      - name: скрытыйДоНачала
        text: >
          Организаторы определяют ситуацию заранее, но игроки и другие участники
          о ней не знают (сюрприз). Раскрытие — к началу поединка / по правилам таймера
          (событие раскрытиеСитуации). Не путать со случайный.
        description: >
          Организаторы определяют ситуацию заранее, но игроки и другие участники
          о ней не знают (сюрприз). Раскрытие — к началу поединка / по правилам таймера
          (событие раскрытиеСитуации). Не путать со случайный.
      - name: случайный
        text: ситуация заранее не выбрана, выбирается розыгрышем
  - name: РольОрганизатора
    values:
      - id: планированиеМероприятия
        label: Планирование мероприятия
      - id: подготовкаУчастников
        label: Подготовка участников
      - id: работаСНовичками
        label: Работа с новичками
      - id: показывалЧасы
        label: Показывал часы
      - id: велЗапись
        label: Вел запись
      - id: настраивалКомнатыZoom
        label: Настраивал комнаты Zoom
      - id: экспертныйКомментарий
        label: Экспертный комментарий
      - id: организацияПомещения
        label: Организация помещения
      - id: подготовкаМатериалов
        label: Подготовка материалов
      - id: подведениеИтогов
        label: Подведение итогов
      - id: обновлениеДанных
        label: Обновление данных
      - id: обработкаВидео
        label: Обработка видео
  - name: КоллегияСудьи
    values:
      - id: нанимающиесяНаРаботу
        label: Нанимающиеся на работу
      - id: отправляющиеНаПереговоры
        label: Отправляющие на переговоры
      - id: доверяющиеСобственность
        label: Доверяющие собственность
      - id: неизвестна
        label: Коллегия неизвестна
        note: "Голос в протоколе без ФИО судьи (напр. УБ Лидер). Не коллегия формы таймера."
  - name: ТипСобытияПротокола
    values:
      - стартРаунда
      - конецРаунда
      - сменаХода
      - пауза
      - протест
      - голос
      - выборРоли
      - жеребьёвка
      - id: расчетСитуации
        label: расчет ситуации
        note: >
          Фиксирует, какая ситуация выпала при режиме случайный.
          Не путать со скрытыйДоНачала (там ситуация уже известна организаторам).
      - раскрытиеСитуации
      - завершение
  - name: ТипВидео
    values:
      - id: ДеньЦеликом
        label: ДеньЦеликом
        note: только мероприятие, поединок null
      - id: Поединок
        label: Поединок
        note: поединок обязан быть

invariants:
  - id: express-judges-5
    status: canon
    text: >
      У экспресса всегда 5 судейских слотов формы (вместимость / RefereeQty = 5, правило типа).
      Это слоты формы, не «всегда 5 записей Судья» и не обязательно количествоСудей = 5:
      Пустой слот не запись Судья. Голос 1/2 без ФИО — запись без idУчастника (коллегия неизвестна).
      Сколько назначено — qty-matches-slots.
  - id: qty-matches-slots
    status: canon
    text: >
      Число записей Судья у поединка строго равно Поединок.количествоСудей (COUNT = поле).
      Пустой слот формы не запись. У экспресса назначено 0..5; вместимость формы всегда 5
      (express-judges-5). У классики/парного вместимость формы 5/7/9 (referee-qty-5-7-9) —
      не требование заполнить все слоты. Стык: слоты формы ≠ число записей / количествоСудей.
  - id: express-only-sending
    status: canon
    text: >
      У экспресса видна только коллегия «Отправляющие на переговоры» (5 кнопок);
      «Нанимающиеся на работу» и «Доверяющие собственность» скрыты / серые в колонке экспресса.
  - id: express-no-seconds
    status: canon
    text: >
      У экспресса нет секундантов и нет вторых игроков (только игроки).
      секундантИлиВторойИгрок1Id и секундантИлиВторойИгрок2Id строго NULL.
  - id: second-or-player2-by-type
    status: canon
    text: >
      Одни слоты секундантИлиВторойИгрок1Id / секундантИлиВторойИгрок2Id (не новые поля).
      Классика: секунданты (опционально).
      Парный: секундантов нет; поля = вторые игроки сторон;
      состав стороны = игрокN + секундантИлиВторойИгрокN.
      Экспресс: оба строго NULL (см. express-no-seconds).
  - id: referee-qty-5-7-9
    status: canon
    text: >
      Вместимость формы (число слотов/кнопок) ∈ {5, 7, 9}. Классика и парный — любое из трёх.
      Экспресс — всегда 5 (express-judges-5). Это не количествоСудей в БД и не требование
      полного ряда записей Судья (см. qty-matches-slots).
      Таймер нормализует к ближайшему из множества, при равной дистанции вверх (6→7, 8→9, 4→5).
  - id: classic-pair-colleges
    status: canon
    text: Классика и парный используют три коллегии (Нанимающиеся на работу, Отправляющие на переговоры, Доверяющие собственность); набор строк зависит от 5/7/9.
  - id: round-minutes-5-4-1
    status: canon
    text: >
      длительностьРаундаМин ∈ {5, 4, 1}. Связано с Поединок.тип (ТипПоединка):
      экспресс — всегда 1; парный — всегда 5; классика — всегда 4 или 5 (не 1).
  - id: video-always-event
    status: canon
    text: >
      Видео всегда принадлежит одному мероприятию.
      Связь с поединком — по ТипВидео (см. video-type-vs-duel), не «всегда опционально».
  - id: video-type-vs-duel
    status: canon
    text: >
      ТипВидео.ДеньЦеликом ⇒ поединок null.
      ТипВидео.Поединок ⇒ поединок обязан быть.
  - id: registration-optional-person
    status: canon
    text: Регистрация может быть без Человека (0..1).
  - id: players-optional
    status: canon
    text: игрок1Id/игрок2Id и секундантИлиВторойИгрокNId необязательны (нет * на диаграмме).
  - id: situation-optional
    status: canon
    text: >
      У поединка ситуация 0..1; в режиме случайный может быть без выбранной
      до события расчетСитуации.
  - id: hidden-ne-random
    status: canon
    text: >
      скрытыйДоНачала и случайный — разные значения enum РежимПодготовкиИгроков.
      случайный — ситуация заранее не выбрана (розыгрыш);
      скрытыйДоНачала — уже выбрана оргами, для игроков сюрприз.
      Это разные поля/значения справочника, не взаимоисключающий костыль.
  - id: cannot-judge-own-duel
    status: canon
    text: >
      Игрок и человек в слоте секундантИлиВторойИгрокN не назначаются судьями в этом же поединке.
      В одном поединке человек не занимает две роли. Запись без idУчастника (коллегия неизвестна) в это не входит.
  - id: unknown-judge-placeholder
    status: canon
    text: >
      Голос 1/2 без ФИО → запись Судья без человека (idУчастника null), коллегия неизвестна.
      Человека «Судья неизвестен» в справочнике нет. Пустой слот без голоса не запись.
      В рейтинге «судил» не начисляется (нет человека); голоса игрокам считаются.
  - id: inactive-not-assigned
    status: canon
    text: Неактивные люди исключаются из автоназначения.
  - id: judges-by-algorithm
    status: canon
    text: >
      Состав судей считает алгоритм, не роль орга. Записи Судья — результат
      (cannot-judge-own-duel, inactive-not-assigned, express-only-sending, слоты 5/7/9).
      Не роль назначалСудей.
  - id: situation-roles-json-by-type
    status: canon
    text: >
      роли JSON: классика/парный — {Role, Goals}; экспресс — два объекта {Role, Phrase}
      (Phrase у первой роли).
  - id: situation-label-computed
    status: canon
    text: Подпись ситуации не хранится — конкатенация код+номер.
  - id: arbitrator-optional
    status: canon
    text: Арбитр на мероприятии необязателен (0..1).
  - id: org-observer-require-person
    status: canon
    text: УчастиеВОрганизацииМероприятия и Наблюдатель всегда ссылаются на Человека (кратность 1).
  - id: votes-on-judge
    status: canon
    text: Голос хранится на Судья, не на Поединок и не отдельным Результатом.
  - id: protocol-is-event-log
    status: canon
    text: >
      Ход боя / сессия таймера ≈ СобытиеПротокола; отдельной обязательной timer_sessions нет.
      Не роль УчастиеВОрганизацииМероприятия и не велПротоколы.
      показывалЧасы — оператор кнопок, протокол пишет таймер.
  - id: involvement-label-computed
    status: canon
    text: >
      Ярлыки «новичок / опытный / орг / судья ФУБ» вычислимы по кругам и статистике
      (рейтинг и история игр); не хранятся. степеньВовлечения в членстве — другое поле.
  - id: organizer-role-enum
    status: canon
    text: >
      УчастиеВОрганизацииМероприятия.роль обязательна, закрытый список РольОрганизатора.
      Несколько ролей у человека на мероприятии — несколько записей УчастиеВОрганизацииМероприятия.
  - id: no-judge-index
    status: canon
    text: >
      У Судья нет поля индекса. Вместимость формы 5/7/9 — правило типа/UI
      (express-judges-5, referee-qty-5-7-9); Поединок.количествоСудей = COUNT записей
      (см. qty-matches-slots).
  - id: membership-person-circle-not-unique
    status: canon
    text: >
      Две записи ЧленствоВКруге допустимы (в т.ч. один человек в одном круге дважды).
      Нет UNIQUE(человек, круг).
  - id: duel-unique-event-date-order
    status: canon
    text: >
      В одном мероприятии не должно быть двух поединков с одним порядок в одну дату.
      UNIQUE по сути (мероприятие, дата, порядок); не глобально (мероприятие, порядок)
      без даты (многодневное мероприятие).
  - id: protocol-identity-by-moment
    status: canon
    text: >
      СобытиеПротокола.порядковыйНомер — опциональный/удобный счётчик, не правило целостности.
      Порядок и идентичность — по точному времени события (момент / моментСек).
      Нет UNIQUE(поединок, порядковыйНомер).
  - id: person-fio-not-unique
    status: canon
    text: >
      Жёсткой уникальности ФИО нет. Полных однофамильцев пока нет — наблюдение,
      не UNIQUE(ФИО). Коллизию решать вручную, если появится.
  - id: situation-code-not-unique
    status: canon
    text: >
      Ситуация в теории может повторяться; нет UNIQUE(код).
      Код+номер могут совпадать у разных записей / ситуация может повторяться в банке.
  - id: organizer-role-unique
    status: canon
    text: >
      В одном мероприятии у одного человека одна и та же роль не дважды.
      UNIQUE(мероприятие, человек, роль). Разные роли — разные записи.
  - id: registration-unique-in-event
    status: canon
    text: >
      В одном мероприятии нельзя две заявки РегистрацияНаМероприятие с одним email.
      Если email пуст — нельзя две с тем же участникФИО.
      Идентификатор заявителя: email, если задан, иначе ФИО.
      Не глобальный UNIQUE по ФИО на все мероприятия.
      Повторная регистрация: «Вы уже зарегистрированы».
  - id: event-slug-unique
    status: canon
    text: >
      Мероприятие.ярлык — опциональный URL-slug портала, не название
      (примеры: kupala_26, online_27). Без ярлыка ссылка по id.
      Если задан — UNIQUE(ярлык) среди непустых; NULL/пустое не конфликтует.

decisions:
  - нет материалов / методичек в модели
  - нет НачислениеБаллов; рейтинг = отчёт
  - нет сущности РезультатПоединка; победитель/счёт по Судья.голос
  - арбитр = ассоциация Человек—Мероприятие
  - ситуация без хранимого названия
  - видео — отдельный класс; всегда к мероприятию; к поединку по типу (ДеньЦеликом null, Поединок обязан)
  - журнал изменений поединка вместо пар план/факт
  - сессия таймера ≈ СобытиеПротокола
  - нет «Команда 1/2» в домене (артефакт Google)
  - нет поля ктоНачинал; жеребьёвка = расстановка игроков + событие
  - УчастиеВОрганизацииМероприятия и Наблюдатель раздельно; регистрация — заявки
  - у Человека нет телефона и хранимых флагов опыта/орга; вовлечённость через Круг
  - ярлыки новичок/опытный/орг/судья ФУБ — вычислимые, не колонка
  - нет класса Раунд и контейнера ПротоколПоединка
  - УчастиеВОрганизацииМероприятия.роль — enum РольОрганизатора; несколько ролей = несколько записей; состав судей и протокол не роли этого enum
  - состав судей считает алгоритм, не роль орга; записи Судья — результат алгоритма (не назначалСудей)
  - протокол пишет таймер (СобытиеПротокола); не роль велПротоколы; показывалЧасы — оператор кнопок
  - у Судья нет индекса; вместимость формы 5/7/9 (UI); количествоСудей = COUNT(Судья)
  - ТипСитуации слит с ТипПоединка; Ситуация.тип и Поединок.тип — один enum
  - нет значения «другое» у ТипМероприятия
  - секундант / 2-й игрок — одни поля секундантИлиВторойИгрокNId (классика — секунданты, парный — 2-й игрок, экспресс — строго NULL)
  - длительностьРаундаМин по типу: экспресс=1, парный=5, классика ∈ {4, 5}

not_in_model:
  - рейтинг / матрица / баллы как сущности
  - duel_results / ИсточникИтога (снимок витрины)
  - Google-only поля и Команда 1/2
  - sync_runs / app_settings / materials
  - файлы видео на диске
  - CRM-воронка
  - Раунд / ПротоколПоединка / timer_sessions как источник истины
  - УчастиеВПоединке / ктоНачинал
  - флаги новичок/опытный/орг/expert на Человек (вычислимые, не колонки)
  - статус обработки видео; visibility портала как поле
  - исключения «не может на этот поединок» (только сессия таймера)
  - Судья.индекс
  - логика часов парного «как у классики» (UI таймера, README; не инвариант схемы БД)
